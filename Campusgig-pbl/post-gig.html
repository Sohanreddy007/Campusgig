```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post a Gig - CampusGig</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">CampusGig</a>

            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="Gigs.html">Browse Gigs</a>
                <a href="post-gig.html" class="active">Post a Gig</a>
                <a href="dashboard.html">Dashboard</a>
                <a href="login.html">Login</a>
                <a href="register.html">Register</a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="page-container">

        <section class="form-section">

            <div class="form-header">
                <h1>Post a Gig</h1>
                <p>Have a task that needs to be done? Post it on CampusGig and find the right student.</p>
            </div>

            <!-- IMPORTANT:
                 The form now sends data to PostGigServlet -->
            <form id="postGigForm" action="post-gig" method="POST">

                <!-- Gig Title -->
                <div class="form-group">
                    <label for="gigTitle">Gig Title</label>
                    <input
                        type="text"
                        id="gigTitle"
                        name="title"
                        placeholder="Enter the title of your gig"
                        required>
                </div>

                <!-- Description -->
                <div class="form-group">
                    <label for="gigDescription">Description</label>
                    <textarea
                        id="gigDescription"
                        name="description"
                        rows="6"
                        placeholder="Describe what needs to be done..."
                        required></textarea>
                </div>

                <!-- Budget -->
                <div class="form-group">
                    <label for="gigBudget">Budget</label>
                    <input
                        type="number"
                        id="gigBudget"
                        name="budget"
                        min="1"
                        step="0.01"
                        placeholder="Enter your budget"
                        required>
                </div>

                <!-- Deadline -->
                <div class="form-group">
                    <label for="gigDeadline">Deadline</label>
                    <input
                        type="date"
                        id="gigDeadline"
                        name="deadline"
                        required>
                </div>

                <!-- Submit -->
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">
                        Post Gig
                    </button>

                    <a href="Gigs.html" class="btn btn-secondary">
                        Cancel
                    </a>
                </div>

            </form>

        </section>

    </main>

    <!--
        IMPORTANT:
        Do NOT add event.preventDefault() here.
        The form must be allowed to submit to PostGigServlet.
    -->

</body>
</html>
```
