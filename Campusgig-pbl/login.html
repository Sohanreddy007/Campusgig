```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - CampusGig</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar">

        <div class="logo">
            Campus<span>Gig</span>
        </div>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="Gigs.html">Browse Gigs</a>
            <a href="post-gig.html">Post a Gig</a>
            <a href="login.html" class="active">Login</a>
            <a href="register.html">Register</a>
        </div>

    </nav>


    <!-- LOGIN SECTION -->
    <section class="auth-section">

        <div class="auth-container">

            <div class="auth-header">
                <h1>Welcome Back</h1>
                <p>Login to your CampusGig account</p>
            </div>


            <!-- LOGIN FORM -->
            <form id="loginForm" action="/CampusGig/login" method="POST">

                <!-- EMAIL -->
                <div class="form-group">

                    <label for="loginEmail">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="loginEmail"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <!-- PASSWORD -->
                <div class="form-group">

                    <label for="loginPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="loginPassword"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <!-- LOGIN BUTTON -->
                <button type="submit" class="auth-button">
                    Login
                </button>

            </form>


            <!-- REGISTER LINK -->
            <div class="auth-footer">

                <p>
                    Don't have an account?
                    <a href="register.html">
                        Create an account
                    </a>
                </p>

            </div>

        </div>

    </section>


    <!-- FOOTER -->
    <footer>

        <p>
            © 2026 CampusGig. All rights reserved.
        </p>

    </footer>


    <script src="js/script.js"></script>

</body>
</html>
```
