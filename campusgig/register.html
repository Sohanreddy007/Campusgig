<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | CampusGig</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="auth-body">

    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="nav-container">

            <a href="index.html" class="logo">
                <span class="logo-icon">C</span>
                CampusGig
            </a>

            <div class="nav-actions">

                <span class="auth-question">
                    Already have an account?
                </span>

                <a href="login.html" class="btn btn-outline">
                    Log in
                </a>

            </div>

        </div>
    </nav>


    <!-- REGISTER -->
    <main class="auth-page">

        <div class="auth-card register-card">

            <div class="auth-header">

                <div class="auth-logo">
                    C
                </div>

                <h1>Create your account</h1>

                <p>
                    Join CampusGig and start discovering opportunities.
                </p>

            </div>


            <form id="registerForm">

                <!-- NAME -->
                <div class="form-group">

                    <label for="registerName">
                        Full name
                    </label>

                    <input
                        type="text"
                        id="registerName"
                        name="name"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <!-- EMAIL -->
                <div class="form-group">

                    <label for="registerEmail">
                        University email
                    </label>

                    <input
                        type="email"
                        id="registerEmail"
                        name="email"
                        placeholder="you@woxsen.edu.in"
                        required
                    >

                    <small>
                        Use your university email address.
                    </small>

                </div>


                <!-- PASSWORD -->
                <div class="form-group">

                    <label for="registerPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="registerPassword"
                        name="password"
                        placeholder="Create a password"
                        minlength="6"
                        required
                    >

                    <small>
                        Password must contain at least 6 characters.
                    </small>

                </div>


                <!-- CONFIRM PASSWORD -->
                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Re-enter your password"
                        required
                    >

                </div>


                <!-- TERMS -->
                <label class="remember-me terms-checkbox">

                    <input
                        type="checkbox"
                        id="terms"
                        required
                    >

                    <span>
                        I agree to the CampusGig community guidelines.
                    </span>

                </label>


                <!-- BUTTON -->
                <button
                    type="submit"
                    class="btn btn-primary auth-submit"
                >
                    Create Account →
                </button>

            </form>


            <!-- LOGIN LINK -->
            <div class="auth-bottom register-bottom">

                <p>
                    Already have an account?
                    <a href="login.html">
                        Log in
                    </a>
                </p>

            </div>

        </div>

    </main>


    <!-- FOOTER -->
    <footer class="auth-footer">

        <p>
            © 2026 CampusGig. Built for students.
        </p>

    </footer>


    <script src="js/script.js"></script>

</body>

</html>
